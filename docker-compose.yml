# Full stack: SQL Server + ASP.NET Core API + Angular (nginx)
#   docker compose up --build
#   then open http://localhost:8080
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ptw_Strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ptw_Strong_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=PtwDb;User Id=sa;Password=Ptw_Strong_Passw0rd!;TrustServerCertificate=True"
      Jwt__Key: "docker-compose-demo-signing-key-change-me-0123456789"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5089:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqldata:
